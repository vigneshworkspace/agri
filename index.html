<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AgriAssist Pro</title>
    <script>
        // Configure Tailwind to use class-based dark mode so our ThemeProvider can toggle it
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d'
                        }
                    }
                }
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        /* Import Inter font - must be first */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        /* Enhanced font and color scheme */
        body {
            font-family: 'Inter', 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            font-weight: 400;
            line-height: 1.6;
        }
        
        /* DarkDark Theme Colors */
        .dark {
            background-color: #121212 !important;
            color: #E0E0E0 !important;
        }
        
        .dark .chat-bubble {
            background-color: #333333 !important;
            color: #E0E0E0 !important;
        }
        
        .dark .tools-area {
            background-color: #121212 !important;
            color: #E0E0E0 !important;
        }
        
        .dark .bg-slate-800, .dark .bg-slate-800\/95 {
            background-color: #1F1F1F !important;
        }
        
        .dark .border-slate-700 {
            border-color: #4F4F4F !important;
        }
        
        /* Improved button and interactive element styling */
        button, .btn {
            font-weight: 600;
            letter-spacing: 0.025em;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        /* Better heading typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #111827;
        }
        
        .dark h1, .dark h2, .dark h3, .dark h4, .dark h5, .dark h6 {
            color: #E0E0E0;
        }
        
        /* Consistent color scheme overrides */
        .dark {
            color-scheme: dark;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Mobile touch improvements */
        @media (max-width: 768px) {
            * {
                -webkit-tap-highlight-color: transparent;
            }
            
            input, textarea, select {
                font-size: 16px;
            }
        }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <!-- Google Translate removed: language select hidden to use built-in language toggle -->
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
