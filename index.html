<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriAssist Pro</title>
    <script>
        // Configure Tailwind to use class-based dark mode so our ThemeProvider can toggle it
        window.tailwind = window.tailwind || {};
        window.tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        };
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Translate is loaded and initialized from the React components (LandingPage/LanguageTranslator) -->
</head>
<body>
    <div id="root"></div>
            <!-- Hidden Google Translate element for our custom language selector -->
            <div id="page-translator" style="display: none !important;"></div>
            <style>
                /* Hide Google Translate widget completely since we have our own interface */
                #page-translator, .goog-te-gadget, .goog-te-banner-frame, .goog-te-balloon-frame { 
                    display: none !important; 
                    visibility: hidden !important;
                }
                .goog-te-gadget img, .goog-te-gadget-icon { display: none !important; }
                .notranslate { translate: no !important; }
                /* Hide Google's translation bar */
                .goog-te-banner-frame.skiptranslate { display: none !important; }
                body { top: 0px !important; }
            </style>

            <script>
                function googleTranslateElementInit() {
                    try {
                        new google.translate.TranslateElement({
                            pageLanguage: 'en',
                            includedLanguages: 'en,es,fr,de,hi,zh-cn',
                            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                            autoDisplay: false
                        }, 'page-translator');
                    } catch (e) {
                        // ignore if API not loaded or blocked
                    }
                }
                (function loadTranslate(){
                    if (!document.querySelector('script[src*="translate_a/element.js"]')) {
                        var s = document.createElement('script');
                        s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
                        s.async = true;
                        document.head.appendChild(s);
                    } else {
                        setTimeout(function(){ try { googleTranslateElementInit(); } catch(e){} }, 200);
                    }
                })();
            </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
